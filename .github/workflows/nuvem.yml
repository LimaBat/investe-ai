name: Publicar o intermediário (IA e reajuste na nuvem)

on:
  push:
    branches: [main]
    paths: ["proxy-ia/**", ".github/workflows/nuvem.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuvem
  cancel-in-progress: false

jobs:
  cloudflare:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir os segredos da Cloudflare
        id: tem
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Crie os segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID no GitHub para publicar o intermediário automaticamente."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            # tolera o segredo colado com espaços, aspas, "Bearer" ou o comando curl inteiro: fica só o token
            T=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r' | grep -oE '[A-Za-z0-9_-]{30,}' | tail -1 || true)
            A=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -oE '[0-9a-fA-F]{32}' | head -1 || true)
            echo "token: ${#T} caracteres, começa com ${T:0:5}; conta: ${#A} caracteres"
            if [ -n "$T" ]; then echo "::add-mask::$T"; echo "CLOUDFLARE_API_TOKEN=$T" >> "$GITHUB_ENV"; fi
            if [ -n "$A" ]; then echo "CLOUDFLARE_ACCOUNT_ID=$A" >> "$GITHUB_ENV"; fi
          fi
      - uses: actions/setup-node@v4
        if: steps.tem.outputs.ok == 'true'
        with:
          node-version: 20
      - name: Criar (ou achar) o espaço das inscrições
        if: steps.tem.outputs.ok == 'true'
        working-directory: proxy-ia
        run: |
          set -eo pipefail
          V=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "token da Cloudflare: $(echo "$V" | jq -c '{ok: .success, status: .result.status, erros: [.errors[]?.message]}')"
          if [ "$(echo "$V" | jq -r .success)" != "true" ]; then echo "::error::O CLOUDFLARE_API_TOKEN não foi aceito pela Cloudflare. Gere um token novo e cole de novo no segredo do GitHub."; exit 1; fi
          C=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")
          echo "conta: $(echo "$C" | jq -c '{ok: .success, erros: [.errors[]?.message]}')"
          if [ "$(echo "$C" | jq -r .success)" != "true" ]; then echo "::error::O CLOUDFLARE_ACCOUNT_ID está errado ou o token não tem acesso a essa conta."; exit 1; fi
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?per_page=100" | jq -r '.result[] | select(.title=="investe-ai-nuvem") | .id' | head -1)
          if [ -z "$ID" ]; then
            ID=$(curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d '{"title":"investe-ai-nuvem"}' "$API" | jq -r '.result.id')
          fi
          test -n "$ID" && test "$ID" != "null"
          sed -i "s/__NUVEM_KV_ID__/$ID/" wrangler.toml
          grep -n "id = " wrangler.toml
      - name: Publicar na Cloudflare
        if: steps.tem.outputs.ok == 'true'
        working-directory: proxy-ia
        run: npx --yes wrangler@4 deploy
      - name: Guardar os segredos do reajuste na nuvem
        if: steps.tem.outputs.ok == 'true'
        working-directory: proxy-ia
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT: ${{ secrets.TELEGRAM_BOT }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.GOOGLE_WEB_CLIENT_SECRET }}
        run: |
          for N in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET BRAPI_TOKEN TELEGRAM_TOKEN TELEGRAM_BOT GOOGLE_WEB_CLIENT_ID GOOGLE_WEB_CLIENT_SECRET; do
            V="${!N}"
            if [ -n "$V" ]; then printf '%s' "${V#@}" | npx --yes wrangler@4 secret put "$N" >/dev/null && echo "$N guardado"; else echo "::warning::Segredo $N vazio no GitHub."; fi
          done
      - name: Ligar o robô do Telegram e conferir
        if: steps.tem.outputs.ok == 'true'
        env:
          IA_PROXY_URL: ${{ secrets.IA_PROXY_URL }}
          IA_PROXY_TOKEN: ${{ secrets.IA_PROXY_TOKEN }}
        run: |
          sleep 15
          curl -fsS "$IA_PROXY_URL/saude"; echo
          curl -sS -X POST -H "x-app-token: $IA_PROXY_TOKEN" "$IA_PROXY_URL/nuvem/configurar-telegram"; echo
