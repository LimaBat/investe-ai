# Gera o Investe.AI.exe (Windows), o app de Mac e o Investe.AI.bat, testa o .exe e publica numa Release.
# Para publicar uma versão: no GitHub, Releases > Draft a new release > crie a tag (v3.1, v3.2...) > Publish.
# Os arquivos são gerados e anexados à release em uns 10 minutos. Envios para a main e "Run workflow" (aba Actions) só geram e testam, sem publicar.
name: Publicar versão
on:
  release:
    types: [published]
  push:
    branches: [main]   # a cada alteração: só gera e testa (não publica)
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
permissions:
  contents: write
env:
  IA_PROXY_URL: ${{ secrets.IA_PROXY_URL }}
  IA_PROXY_TOKEN: ${{ secrets.IA_PROXY_TOKEN }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  ATUALIZA_REPO: ${{ github.repository }}
  VERSAO: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
jobs:
  windows:
    runs-on: windows-latest
    env:
      TEM_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar o código
        run: python ferramentas/preparar.py
      - name: Instalar dependências
        run: python -m pip install --upgrade pip pyinstaller pillow -r requirements.txt
      - name: Gerar Investe.AI.exe
        run: pyinstaller --noconfirm --onefile --windowed --name Investe.AI --icon investe-ai.ico --collect-all yfinance --collect-all curl_cffi --collect-all webview --collect-data certifi build/investe_ai.py
      - name: Testar a janela própria (pywebview empacotado)
        shell: pwsh
        run: |
          $t = Start-Process -FilePath "dist\Investe.AI.exe" -ArgumentList "--teste-janela" -Wait -PassThru
          if ($t.ExitCode -ne 0) { throw "a janela própria não está no .exe (código $($t.ExitCode))" }
      - name: Testar o .exe (abre sem janela e responde)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Investe.AI.exe" -ArgumentList "--no-window" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { $r = Invoke-RestMethod -Uri "http://127.0.0.1:47615/api/ping" -TimeoutSec 3; if ($r.ok) { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 2
          }
          if (-not $ok) { Get-Content "$env:LOCALAPPDATA\Investe.AI\investe_ai_log.txt" -ErrorAction SilentlyContinue; throw "o .exe não respondeu" }
          Invoke-RestMethod -Uri "http://127.0.0.1:47615/" -TimeoutSec 30 | Out-Null
          try { Invoke-RestMethod -Uri "http://127.0.0.1:47615/api/quit" -TimeoutSec 5 | Out-Null } catch {}
      - name: Assinar o .exe (só se o certificado estiver nos segredos)
        if: env.TEM_CERT == 'true'
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_SENHA: ${{ secrets.WINDOWS_CERT_SENHA }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT))
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $st.FullName sign /f cert.pfx /p $env:CERT_SENHA /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\Investe.AI.exe
          Remove-Item cert.pfx
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Investe.AI.exe
            build/Investe.AI.bat
  mac:
    runs-on: macos-latest
    continue-on-error: true   # o app de Mac é opcional: não impede a publicação do Windows
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ferramentas/preparar.py
      - run: python -m pip install --upgrade pip pyinstaller pillow -r requirements.txt
      - name: Gerar o app de Mac
        run: |
          pyinstaller --noconfirm --windowed --name Investe.AI --icon investe-ai.png --collect-all yfinance --collect-all curl_cffi --collect-all webview --collect-data certifi build/investe_ai.py
          ditto -c -k --keepParent dist/Investe.AI.app Investe.AI-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: Investe.AI-mac.zip
      - name: Anexar o app de Mac à release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: Investe.AI-mac.zip
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # a mesma versão do Python que vai dentro do app (Chaquopy)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Preparar o código
        run: |
          python ferramentas/preparar.py
          cp build/investe_ai.py android/app/src/main/python/investe_ai.py
          V="${VERSAO#v}"; V="${V#V}"; [ -z "$V" ] && V="0.0.${{ github.run_number }}"
          IFS=. read -r A B C <<< "$V"
          echo "VNOME=$V" >> $GITHUB_ENV
          echo "VCOD=$(( ${A:-0}*10000 + ${B:-0}*100 + ${C:-0} ))" >> $GITHUB_ENV
      - name: Gerar APK de teste (emulador)
        run: gradle -p android assembleDebug -Pabis=x86_64 -PversaoNome=$VNOME -PversaoCodigo=$VCOD --stacktrace
      - name: Ligar a aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar no emulador (abre o app e busca cotações reais)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ferramentas/testar_android.sh
      - name: Gerar o APK final (celulares)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/investe.keystore"; export ANDROID_KEYSTORE="$RUNNER_TEMP/investe.keystore"; else echo "AVISO: sem a chave de assinatura; o APK sai com assinatura de teste"; fi
          gradle -p android assembleRelease -Pabis=arm64-v8a -PversaoNome=$VNOME -PversaoCodigo=$VCOD
          cp android/app/build/outputs/apk/release/app-release.apk Investe.AI.apk
          ls -la Investe.AI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Investe.AI.apk
      - name: Anexar o APK à release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: Investe.AI.apk
  publicar:
    if: github.event_name == 'release'
    needs: [windows]   # o Mac anexa o próprio arquivo quando ficar pronto (a fila de Mac do GitHub pode demorar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: arquivos
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: false
          files: |
            arquivos/dist/Investe.AI.exe
            arquivos/build/Investe.AI.bat
