# Versão para navegador (docs/app, Pyodide): testa num Chrome de verdade e, a cada release, publica no site.
name: Versão para navegador
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ["docs/app/**", "investe_ai.py", "proxy-ia/worker.js", "ferramentas/*web*", "ferramentas/preparar.py", ".github/workflows/web.yml"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: web-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preparar o código para o navegador
        env:
          VERSAO: ${{ github.event.release.tag_name }}
          IA_PROXY_URL: ${{ secrets.IA_PROXY_URL }}
          IA_PROXY_TOKEN: ${{ secrets.IA_PROXY_TOKEN }}
        run: |
          python ferramentas/preparar.py
          cp build/investe_ai.py docs/app/investe_ai.py
          cp android/app/src/main/python/peewee.py docs/app/peewee.py
          pip download sgmllib3k --no-deps --no-binary :all: -d "$RUNNER_TEMP/sg"
          tar -xzf "$RUNNER_TEMP"/sg/sgmllib3k-*.tar.gz -C "$RUNNER_TEMP/sg"
          cp "$RUNNER_TEMP"/sg/sgmllib3k-*/sgmllib.py docs/app/sgmllib.py
          ls -la docs/app
      - name: Testar num Chrome de verdade
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node ferramentas/servidor_web_teste.mjs > servidor.log 2>&1 &
          sleep 2
          node ferramentas/testar_web.mjs
      - name: Registro do intermediário
        if: always()
        run: tail -c 6000 servidor.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-teste
          path: |
            web-teste.png
            servidor.log
      - name: Publicar no site (só nas releases)
        if: github.event_name == 'release'
        env:
          VERSAO: ${{ github.event.release.tag_name }}
          IA_PROXY_URL: ${{ secrets.IA_PROXY_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '// gerado pela publicação\nwindow.INVESTEAI_PROXY = "%s";\nwindow.INVESTEAI_VERSAO = "%s";\n' "${IA_PROXY_URL%/}" "${VERSAO#v}" > docs/app/config.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app/config.js docs/app/investe_ai.py docs/app/peewee.py docs/app/sgmllib.py
          git commit -m "Versão para navegador ${VERSAO}" || echo "nada mudou"
          git pull --rebase -q origin main
          git push origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "o site atualiza sozinho em alguns minutos"
