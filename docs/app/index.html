<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Investe.AI no navegador</title>
<meta name="description" content="Use o Investe.AI direto no navegador: corretora simulada com preços reais, análise de ativos e assistente de IA.">
<link rel="icon" href="../icone.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#0b1020;color:#e8ecf7;font-family:Inter,"Segoe UI",system-ui,sans-serif;display:grid;place-items:center;position:relative;transition:opacity .55s ease,transform .55s ease}
body.saindo{opacity:0;transform:scale(1.04)}
.bg{position:fixed;inset:0;background:radial-gradient(900px 600px at 20% 10%,rgba(139,92,246,.22),transparent 60%),radial-gradient(800px 600px at 85% 90%,rgba(94,234,212,.16),transparent 60%),#0b1020}
.grid{position:fixed;inset:-50%;background-image:linear-gradient(rgba(148,163,200,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,200,.07) 1px,transparent 1px);background-size:56px 56px;transform:perspective(700px) rotateX(62deg) translateY(-8%);animation:andar 7s linear infinite;mask-image:radial-gradient(closest-side,#000 25%,transparent 75%);-webkit-mask-image:radial-gradient(closest-side,#000 25%,transparent 75%)}
@keyframes andar{to{background-position:0 56px}}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.38;animation:flut 16s ease-in-out infinite}
.orb.a{width:420px;height:420px;background:#8b5cf6;top:-120px;right:8%}
.orb.b{width:360px;height:360px;background:#5eead4;bottom:-140px;left:12%;animation-delay:-6s;animation-duration:20s}
@keyframes flut{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.12)}}
.bars{position:fixed;left:0;right:0;bottom:0;height:34vh;display:flex;align-items:flex-end;justify-content:center;gap:10px;opacity:.5;mask-image:linear-gradient(to top,#000,transparent);-webkit-mask-image:linear-gradient(to top,#000,transparent)}
.bars i{width:14px;border-radius:6px 6px 0 0;background:linear-gradient(to top,rgba(94,234,212,.0),rgba(94,234,212,.55));animation:sobe 2.6s ease-in-out infinite;transform-origin:bottom}
@keyframes sobe{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.centro{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px;animation:entra .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes entra{from{opacity:0;transform:translateY(18px) scale(.97)}}
.logo{position:relative;width:132px;height:132px;display:grid;place-items:center;margin-bottom:30px}
.logo .anel{position:absolute;inset:0;border-radius:36px;background:conic-gradient(from 0deg,#5eead4,#8b5cf6,#f472b6,#5eead4);animation:gira 3.2s linear infinite;filter:blur(.3px)}
.logo .anel::after{content:"";position:absolute;inset:3px;border-radius:33px;background:#0b1226}
.logo .pulso{position:absolute;inset:-8px;border-radius:44px;border:2px solid rgba(94,234,212,.5);animation:pulso 2.4s ease-out infinite}
.logo .pulso.b{animation-delay:1.2s}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes pulso{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.logo .nucleo{position:relative;width:104px;height:104px;border-radius:30px;background:linear-gradient(135deg,#5eead4,#8b5cf6);display:grid;place-items:center;box-shadow:0 18px 50px -12px rgba(139,92,246,.7);animation:flutua 3s ease-in-out infinite}
@keyframes flutua{50%{transform:translateY(-6px)}}
.nucleo svg{width:58px;height:58px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.nucleo .l1{stroke-dasharray:44;stroke-dashoffset:44;animation:desenha 2.4s ease-in-out infinite}
.nucleo .l2{stroke-dasharray:14;stroke-dashoffset:14;animation:desenha2 2.4s ease-in-out infinite}
@keyframes desenha{0%{stroke-dashoffset:44}55%,100%{stroke-dashoffset:0}}
@keyframes desenha2{0%,50%{stroke-dashoffset:14}75%,100%{stroke-dashoffset:0}}
h1{font-size:46px;letter-spacing:-1px;font-weight:800;background:linear-gradient(90deg,#5eead4,#8b5cf6,#f472b6,#5eead4);background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brilho 5s linear infinite}
@keyframes brilho{to{background-position:250% 0}}
.sub{color:#8d9ab8;margin-top:6px;font-size:15px;letter-spacing:.4px}
.prog{width:min(420px,78vw);margin-top:38px}
.trilho{height:6px;border-radius:99px;background:rgba(148,163,200,.16);overflow:hidden;position:relative}
.trilho i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#5eead4,#8b5cf6);box-shadow:0 0 18px rgba(94,234,212,.7);position:relative}
.trilho i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:varre 1.4s ease-in-out infinite}
@keyframes varre{to{transform:translateX(100%)}}
.info{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:#8d9ab8;min-height:20px}
#msg{transition:opacity .25s,transform .25s}
#msg.troca{opacity:0;transform:translateY(5px)}
#pct{font-variant-numeric:tabular-nums;color:#e8ecf7;font-weight:600}
.pontos{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.pontos i{width:5px;height:5px;border-radius:50%;background:#5eead4;animation:ponto 1.1s infinite}
.pontos i:nth-child(2){animation-delay:.18s}.pontos i:nth-child(3){animation-delay:.36s}
@keyframes ponto{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1.2)}}
.erro{display:none;margin-top:26px;max-width:460px;padding:14px 18px;border:1px solid rgba(248,113,113,.5);background:rgba(248,113,113,.1);color:#fca5a5;border-radius:14px;font-size:14px;line-height:1.5}
.aviso{position:fixed;bottom:22px;left:0;right:0;text-align:center;font-size:12px;color:#5d6a89;z-index:2}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}.nucleo .l1,.nucleo .l2{stroke-dashoffset:0}}
html,body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.orb.a{width:280px;height:280px;top:-90px;right:-60px}
.orb.b{width:260px;height:260px;bottom:-100px;left:-60px}
.grid{background-size:40px 40px}
.bars{height:28vh;gap:7px}
.bars i{width:9px}
.centro{padding:24px 28px;margin-top:-6vh}
.logo{width:112px;height:112px;margin-bottom:26px}
.logo .anel{border-radius:31px}.logo .anel::after{border-radius:28px}
.logo .pulso{border-radius:38px}
.logo .nucleo{width:88px;height:88px;border-radius:26px}
.nucleo svg{width:50px;height:50px}
h1{font-size:clamp(34px,10.5vw,44px)}
.sub{font-size:14px}
.prog{width:min(360px,80vw);margin-top:34px}
.info{font-size:12.5px;gap:10px;text-align:left}
.erro{font-size:13.5px;max-width:88vw}
.aviso{bottom:16px;padding:0 24px;font-size:11.5px;line-height:1.4}
/* celular: só animações que a placa de vídeo faz sozinha (transform e opacity), para ficar fluido enquanto o app inicia */
.orb{filter:none;opacity:.5;will-change:transform}
.orb.a{width:520px;height:520px;top:-230px;right:-200px;background:radial-gradient(circle,rgba(139,92,246,.75) 0,rgba(139,92,246,.28) 34%,rgba(139,92,246,0) 68%)}
.orb.b{width:500px;height:500px;bottom:-230px;left:-200px;background:radial-gradient(circle,rgba(94,234,212,.6) 0,rgba(94,234,212,.22) 34%,rgba(94,234,212,0) 68%)}
.grid{animation:none}
.bars i{will-change:transform}
.logo .anel{filter:none;will-change:transform}
.logo .pulso,.logo .nucleo{will-change:transform,opacity}
h1{animation:none;background-size:100% auto;background-image:linear-gradient(90deg,#5eead4,#8b5cf6 60%,#c084fc)}
.trilho i{width:100%!important;transform:scaleX(0);transform-origin:left center;box-shadow:none;will-change:transform}
.trilho i::after{display:none}
#tela{position:fixed;inset:0;z-index:5;transition:opacity .5s}
#tela.sai{opacity:0;pointer-events:none}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0a0f1e;display:block}
.erro a{color:#5eead4}
</style>
<script src="config.js"></script>
</head><body>
<iframe id="app" title="Investe.AI"></iframe>

<div id="tela"><div class="bg"></div><div class="grid"></div><div class="orb a"></div><div class="orb b"></div>
<div class="bars" id="bars"></div>
<div class="centro">
  <div class="logo"><span class="pulso"></span><span class="pulso b"></span><span class="anel"></span>
    <div class="nucleo"><svg viewBox="0 0 24 24"><polyline class="l1" points="3 17 9 11 13 15 21 6"/><polyline class="l2" points="15 6 21 6 21 12"/></svg></div></div>
  <h1>Investe.AI</h1><div class="sub">Análise com dados reais</div>
  <div class="prog"><div class="trilho"><i id="bar"></i></div>
    <div class="info"><span><span id="msg">Iniciando</span><span class="pontos"><i></i><i></i><i></i></span></span><span id="pct">0%</span></div></div>
  <div class="erro" id="erro"></div>
</div>
<div class="aviso">Versão para navegador. Na primeira vez baixa uns 30 MB; depois abre mais rápido. Ferramenta educativa, não é recomendação de investimento.</div></div>
<script>
(function(){
const params=new URLSearchParams(location.search);
const PROXY=(params.get("proxy")||window.INVESTEAI_PROXY||"").replace(/\/$/,"");
const VERSAO=window.INVESTEAI_VERSAO||"dev";
const barras=document.getElementById("bars");
for(let i=0;i<Math.max(16,Math.min(30,Math.round(innerWidth/16)));i++){const b=document.createElement("i");b.style.height=(30+Math.random()*70)+"%";b.style.animationDelay=(-Math.random()*2.6)+"s";b.style.animationDuration=(2+Math.random()*2.2)+"s";barras.appendChild(b);}
const bar=document.getElementById("bar"),pct=document.getElementById("pct"),msg=document.getElementById("msg"),erro=document.getElementById("erro");
let alvo=2,mostrado=0,parou=false;
(function quadro(){if(parou)return;if(mostrado<alvo)mostrado=Math.min(alvo,mostrado+Math.max(.08,(alvo-mostrado)*.05));
  bar.style.width=mostrado+"%";pct.textContent=Math.floor(mostrado)+"%";requestAnimationFrame(quadro);})();
function falha(t){parou=true;erro.style.display="block";erro.innerHTML=t;msg.textContent="Não foi possível abrir";}
if(!PROXY){falha("Esta página ainda não foi configurada. Baixe o app em <a href='../'>limabat.github.io/investe-ai</a>.");return;}
if(!window.Worker||!window.WebAssembly){falha("Este navegador é antigo demais. Use uma versão recente do Chrome, Edge, Firefox ou Safari.");return;}
const w=new Worker("py.js?v="+encodeURIComponent(VERSAO));
let seq=0;const espera=new Map();
window.__pyFetch=function(u,o){o=o||{};let s=typeof u==="string"?u:(u&&u.url)||"";
  try{const x=new URL(s,location.href);s=x.pathname.replace(/^.*?(\/api\/|\/oauth\/)/,"$1")+x.search;}catch(e){}
  if(!s.startsWith("/api/")&&!s.startsWith("/oauth/"))s="/";
  const id=++seq,metodo=(o.method||"GET").toUpperCase();
  return new Promise((ok,nao)=>{espera.set(id,{ok,nao});
    w.postMessage({tipo:"pedido",id,metodo,caminho:s,corpo:typeof o.body==="string"?o.body:(o.body?String(o.body):"")});});};
w.onmessage=ev=>{const m=ev.data||{};
  if(m.tipo==="progresso"){alvo=m.pct;msg.textContent=m.msg;return;}
  if(m.tipo==="falha"){falha("O Investe.AI não conseguiu iniciar no navegador: "+m.msg.replace(/</g,"&lt;")+"<br>Recarregue a página. Se continuar, baixe o app em <a href='../'>limabat.github.io/investe-ai</a>.");return;}
  if(m.tipo==="resposta"){const p=espera.get(m.id);if(!p)return;espera.delete(m.id);
    p.ok(new Response(m.corpo,{status:m.status,headers:{"content-type":m.ctype}}));return;}
  if(m.tipo==="pronto"){alvo=92;msg.textContent="Abrindo a tela";abrir();}};
w.onerror=e=>falha("Erro ao iniciar: "+String(e.message||e));
w.postMessage({tipo:"iniciar",proxy:PROXY,versao:VERSAO});
async function abrir(){
  const r=await window.__pyFetch("/");let html=await r.text();
  const ponte="<script>window.__WEB__=true;(function(){var f=window.fetch.bind(window),p=window.parent;"+
    "window.fetch=function(u,o){var s=typeof u==='string'?u:(u&&u.url)||'';if(s.charAt(0)==='/'||s.indexOf('/api/')>=0&&s.indexOf(location.host)>=0)return p.__pyFetch(s,o);return f(u,o);};"+
    "if(navigator.sendBeacon)navigator.sendBeacon=function(){return true;};"+
    "document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(!a)return;var h=a.getAttribute('href')||'';"+
    "if(/^https?:/.test(h)){e.preventDefault();window.open(h,'_blank','noopener');}},true);})();<\/script>";
  html=html.replace(/<head>/i,"<head>"+ponte);
  const fr=document.getElementById("app");
  fr.addEventListener("load",()=>{alvo=100;setTimeout(()=>{parou=true;document.getElementById("tela").classList.add("sai");setTimeout(()=>document.getElementById("tela").remove(),700);},500);
    try{document.title=fr.contentDocument.title||"Investe.AI";}catch(e){}},{once:true});
  fr.srcdoc=html;}
})();
</script>
</body></html>
